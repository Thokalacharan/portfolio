<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0d121d" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <text x="50%" y="54%" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="url(#grad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">TC</text>
</svg>
